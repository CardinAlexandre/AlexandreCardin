name: Deploy Portfolio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: registry.cardinalexandre.fr
  IMAGE_NAME: portfolio
  CONTAINER_NAME: cardinalexandre
  CONTAINER_PORT: 80

jobs:
  # ===========================================================================
  # Job 1 — Build & Push
  # Build l'image Docker pour ARM64 et la pousse sur le registry privé
  # ===========================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: AlexandreCardin
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 2 — Deploy
  # Déploie l'image sur le Raspberry Pi via SSH
  # ===========================================================================
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    environment: AlexandreCardin
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RASPBERRY_PI_HOST }}
          username: ${{ secrets.RASPBERRY_PI_USER }}
          key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
          script: |
            set -e

            REGISTRY="${{ env.REGISTRY }}"
            IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:latest"
            CONTAINER="${{ env.CONTAINER_NAME }}"

            echo "=== Login au registry ==="
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" \
              -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            echo "=== Pull de la nouvelle image ==="
            docker pull "$IMAGE"

            echo "=== Arrêt et suppression de l'ancien container ==="
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm   "$CONTAINER" 2>/dev/null || true

            echo "=== Démarrage du nouveau container ==="
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --network proxy \
              --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1" \
              --health-interval 30s \
              --health-timeout 3s \
              --health-start-period 10s \
              --health-retries 3 \
              "$IMAGE"

            echo "=== Vérification du démarrage (attente 10s) ==="
            sleep 10
            if docker ps --filter "name=$CONTAINER" --filter "status=running" | grep -q "$CONTAINER"; then
              echo "✅ Déploiement réussi !"
              docker ps --filter "name=$CONTAINER" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ Le container n'a pas démarré correctement"
              docker logs "$CONTAINER" --tail=20
              exit 1
            fi

            echo "=== Nettoyage des anciennes images ==="
            docker image prune -f

  # ===========================================================================
  # Job 3 — Cleanup runner
  # Nettoie les images sur le runner GitHub après build
  # ===========================================================================
  cleanup:
    name: Cleanup Runner
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: always()

    steps:
      - name: Remove images from runner
        run: |
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} || true
          docker image prune -f
          echo "✅ Nettoyage terminé"