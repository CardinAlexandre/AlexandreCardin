name: Deploy Portfolio to Raspberry Pi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: AlexandreCardin
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to private registry
      uses: docker/login-action@v3
      with:
        registry: registry.cardinalexandre.fr
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: |
          registry.cardinalexandre.fr/portfolio:latest
          registry.cardinalexandre.fr/portfolio:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Raspberry Pi via Portainer
      id: deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.RASPBERRY_PI_HOST }}
        username: ${{ secrets.RASPBERRY_PI_USER }}
        key: ${{ secrets.RASPBERRY_PI_SSH_KEY }}
        script: |
          # Login to private registry
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.cardinalexandre.fr -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

          # Pull the latest image and check if successful
          echo "Pulling latest image..."
          if docker pull registry.cardinalexandre.fr/portfolio:latest; then
            echo "Image pulled successfully"

            # Verify the image exists locally
            if docker image inspect registry.cardinalexandre.fr/portfolio:latest > /dev/null 2>&1; then
              echo "Image verified locally"

              # Stop and remove existing container only if new image is ready
              echo "Stopping existing container..."
              docker stop cardinalexandre || true
              docker rm cardinalexandre || true

              # Run new container
              echo "Starting new container..."
              if docker run -d \
                --name cardinalexandre \
                --restart unless-stopped \
                -p 32772:80 \
                registry.cardinalexandre.fr/portfolio:latest; then
                echo "Container started successfully"

                # Wait a moment and check if container is running
                sleep 5
                if docker ps | grep -q cardinalexandre; then
                  echo "Deployment successful!"
                  echo "DEPLOY_SUCCESS=true" >> $GITHUB_ENV
                else
                  echo "ERROR: Container failed to start properly"
                  echo "DEPLOY_SUCCESS=false" >> $GITHUB_ENV
                  exit 1
                fi
              else
                echo "ERROR: Failed to start new container"
                echo "DEPLOY_SUCCESS=false" >> $GITHUB_ENV
                exit 1
              fi
            else
              echo "ERROR: Image not found locally after pull"
              echo "DEPLOY_SUCCESS=false" >> $GITHUB_ENV
              exit 1
            fi
          else
            echo "ERROR: Failed to pull image"
            echo "DEPLOY_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

    - name: Cleanup local runner images
      if: always()
      run: |
        echo "Cleaning up local runner images..."

        CURRENT_SHA="${{ github.sha }}"

        docker rmi registry.cardinalexandre.fr/portfolio:$CURRENT_SHA || true
        docker rmi registry.cardinalexandre.fr/portfolio:latest || true
        docker image prune -f

        echo "Cleanup completed!"
